description: Antengene Corporation is a commercial-stage, R&D-driven global biopharmaceutical company
  focused on discovering, developing, and commercializing first-in-class and best-in-class therapies
  for the treatment of hematologic malignancies and solid tumors. Headquartered in Shanghai with a
  global footprint across the Asia Pacific region and beyond, Antengene's marketed product XPOVIO
  (selinexor) and a pipeline of oncology assets such as the Claudin 18.2 antibody-drug conjugate
  ATG-022 and the CD73 inhibitor ATG-037 target unmet needs in cancer care. Antengene operates in the
  life sciences sector and does not currently publish a public developer API, SDK, or developer portal;
  this profile was surfaced as a portfolio company of Qiming Venture Partners and captured in the API
  Evangelist network for company intelligence and enrichment.
